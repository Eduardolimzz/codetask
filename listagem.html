<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listagem — CodeTask</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="cadastro.html">Cadastro</a></li>
          <li><a href="listagem.html" class="ativo">Listagem</a></li>
        </ul>
      </nav>
    </header>

   <main>
  <section>
    <h1>Minhas Tarefas</h1>
    <p>Veja todas as tarefas cadastradas.</p>

    <!-- Filtro -->
    <div id="filtros">
      <input type="text" id="busca" placeholder="Buscar por título ou disciplina..." />
      <select id="filtro-status">
        <option value="">Todos os status</option>
        <option value="pendente">Pendente</option>
        <option value="em-andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
      </select>
      <select id="filtro-prioridade">
        <option value="">Todas as prioridades</option>
        <option value="baixa">Baixa</option>
        <option value="media">Média</option>
        <option value="alta">Alta</option>
      </select>
    </div>

    <!-- Tabela -->
    <div id="container-tabela">
      <table id="tabela-tarefas">
        <thead>
          <tr>
            <th>Título</th>
            <th>Disciplina</th>
            <th>Prazo</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- Linhas geradas pelo JS -->
        </tbody>
      </table>
      <p id="sem-tarefas">
        Nenhuma tarefa encontrada.
        <a href="cadastro.html">Cadastrar agora</a>
      </p>
    </div>

  </section>
</main>

    <footer>
      <p>CodeTask &mdash; Gerenciador de Tarefas Acadêmicas &copy; 2025</p>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
