<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro — CodeTask</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="cadastro.html" class="ativo">Cadastro</a></li>
          <li><a href="listagem.html">Listagem</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h1>Cadastrar Tarefa</h1>
        <p>Preencha os campos abaixo para adicionar uma nova tarefa acadêmica.</p>

        <form id="form-cadastro" novalidate>
          <fieldset>
           
            <label for="titulo">Título da Tarefa</label>
            <input
              type="text"
              id="titulo"
              name="titulo"
              placeholder="Ex: Trabalho de Cálculo"
            />

            <label for="disciplina">Disciplina</label>
            <input
              type="text"
              id="disciplina"
              name="disciplina"
              placeholder="Ex: Cálculo I"
            />

            <label for="descricao">Descrição</label>
            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              placeholder="Descreva os detalhes da tarefa..."
            ></textarea>

            <label for="prazo">Prazo de Entrega</label>
            <input
              type="date"
              id="prazo"
              name="prazo"
            />

            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade">
              <option value="">Selecione</option>
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
            </select>

            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="">Selecione</option>
              <option value="pendente">Pendente</option>
              <option value="em-andamento">Em andamento</option>
              <option value="concluida">Concluída</option>
            </select>
          </fieldset>

          <p id="mensagem-erro" role="alert"></p>

          <button type="submit">Cadastrar Tarefa</button>
          <button type="reset">Limpar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>CodeTask &mdash; Gerenciador de Tarefas Acadêmicas &copy; 2025</p>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
